postgresql:
  enabled: false
  # auth:
  #   enablePostgresUser: false
  #   username: peekaping
  #   password: peekaping
  #   database: peekaping

redis:
  enabled: false
  # auth:
  #   password: peekaping

# See docs for configuration details
# https://docs.peekaping.com/architecture/api-server
config:
  existingSecret: "peekaping-config"
  env:
    DB_TYPE: "postgres"  # or mysql, mariadb, sqlite (external DB recommended; MongoDB backend removed)
    # DB_HOST: "peekaping-postgresql.peekaping.svc.cluster.local"
    # DB_PORT: "5432"
    # REDIS_HOST: "peekaping-redis-master.peekaping.svc.cluster.local"
    # REDIS_PORT: "6379"

api:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: jniltinho/peekaping-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8034
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  probes:
    path: /api/v1/health
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
    startup:
      failureThreshold: 30
      periodSeconds: 2

engine:
  replicaCount: 1
  apparmor:
    enabled: false
  image:
    repository: jniltinho/peekaping-engine
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

# Deprecated: use engine instead
worker:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: jniltinho/peekaping-worker
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

web:
  replicaCount: 3
  apparmor:
    enabled: false
  image:
    repository: jniltinho/peekaping-web
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  probes:
    path: /
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 2
      failureThreshold: 5

migrate:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  apparmor:
    enabled: false
  image:
    repository: jniltinho/peekaping-migrate
    tag: "latest"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  # ingressClassName: "alb"
  # namespace: "istio-system"
  # host: "mydomain.com"
  # annotations:
  #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/my-certificate-arn
  #   alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
  #   alb.ingress.kubernetes.io/healthcheck-port: status-port
  #   alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
  #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
  #   alb.ingress.kubernetes.io/load-balancer-attributes: deletion_protection.enabled=true,routing.http.drop_invalid_header_fields.enabled=true
  #   alb.ingress.kubernetes.io/scheme: internal
  #   alb.ingress.kubernetes.io/ssl-redirect: "443"
  #   alb.ingress.kubernetes.io/target-type: ip


istio:
  ingress:
    name: istio-ingressgateway
    port: 80
  gateway:
    enabled: false
    selector: ingressgateway
    port: 80
    protocol: HTTP
    name: http
  virtualservice:
    enabled: false