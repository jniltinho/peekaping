services:
  peekaping:
    build:
      context: .
      dockerfile: Dockerfile.bundle.mysql
    restart: unless-stopped
    ports:
      - "8383:8383"
    env_file:
      - .env
    environment:
      - DB_TYPE=mysql
      - DB_HOST=localhost
      - DB_PASS=password
      - DB_PORT=3306
    volumes:
      # Database data persistence
      - ./.data/mysql:/var/lib/mysql
      # Application logs persistence
      - ./.data/logs:/var/log/supervisor
      # Optional: Custom Caddyfile override
      # - ./custom-Caddyfile:/etc/caddy/Caddyfile:ro
    container_name: peekaping-bundle-mysql
