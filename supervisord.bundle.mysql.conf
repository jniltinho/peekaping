[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:mariadb]
command=mysqld --datadir=/var/lib/mysql --port=%(ENV_DB_PORT)s --user=mysql --bind-address=0.0.0.0 --default-time-zone=+00:00
autostart=true
autorestart=true
user=mysql
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
startsecs=10
startretries=3
stopsignal=INT
stopwaitsecs=10

[program:redis]
command=redis-server --bind 0.0.0.0 --port 6379 --protected-mode no
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=150
startsecs=5
startretries=3

[program:api]
command=/app/server/api
directory=/app/server
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_HOST="0.0.0.0",REDIS_PORT="6379",MODE="prod",SERVER_PORT="8383"
depends_on=mariadb
priority=200
startsecs=10
startretries=3

[program:engine]
command=/app/server/engine
directory=/app/server
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_HOST="0.0.0.0",REDIS_PORT="6379",MODE="prod"
depends_on=mariadb
priority=210
startsecs=10
startretries=3

