[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=postgres -D /var/lib/postgresql/data -p %(ENV_DB_PORT)s
autostart=true
autorestart=true
user=postgres
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=100
startsecs=10
startretries=3
stopsignal=INT
stopwaitsecs=10

[program:redis]
command=redis-server --bind 0.0.0.0 --port 6379 --protected-mode no
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=150
startsecs=5
startretries=3

[program:api]
command=/app/server/monitoring api
directory=/app/server
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_HOST="0.0.0.0",REDIS_PORT="6379",MODE="prod",SERVER_PORT="8383"
depends_on=postgres
priority=200
startsecs=10
startretries=3

[program:engine]
command=/app/server/monitoring engine
directory=/app/server
autostart=true
autorestart=true
user=root
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=REDIS_HOST="0.0.0.0",REDIS_PORT="6379",MODE="prod"
depends_on=postgres
priority=210
startsecs=10
startretries=3

