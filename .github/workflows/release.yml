name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y upx

      - name: Set Version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter web build

      - name: Embed Frontend into Go
        run: |
          rm -rf apps/server/internal/frontend/web/*
          cp -r apps/web/dist/. apps/server/internal/frontend/web/

      - name: Build Application
        working-directory: apps/server
        run: make build

      - name: Package Binary
        run: |
          cd apps/server/bin
          tar -czvf "../../../monitoring_${{ env.VERSION }}_linux_amd64.tar.gz" monitoring

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: monitoring_${{ env.VERSION }}_linux_amd64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
